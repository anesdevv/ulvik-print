<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="50%" stop-color="#0F0F0F" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A50" />
      <stop offset="50%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#FF2E00" />
    </linearGradient>

    <!-- Shirt Fill Gradient -->
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#E03A00" />
    </linearGradient>

    <!-- Graphic Print Gradient -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFD3C4" />
    </linearGradient>

    <!-- Radial Glow Background -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="16" filter="url(#drop-shadow)" />

  <!-- Ambient Glow Behind Shirt -->
  <circle cx="256" cy="270" r="180" fill="url(#ambient-glow)" />

  <!-- The T-Shirt -->
  <path d="M 160 140 
           L 210 140 
           Q 256 175 302 140 
           L 352 140 
           L 430 210 
           L 380 270 
           L 340 250 
           L 340 410 
           L 172 410 
           L 172 250 
           L 132 270 
           L 82 210 
           Z" 
        fill="url(#shirt-grad)" 
        filter="url(#drop-shadow)" />

  <!-- Printed Spark Graphic in the Center -->
  <path d="M 256 240 
           Q 256 280 296 280 
           Q 256 280 256 320 
           Q 256 280 216 280 
           Q 256 280 256 240 
           Z" 
        fill="url(#spark-grad)" />
</svg>